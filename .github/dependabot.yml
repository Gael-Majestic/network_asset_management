# Dependabot opens a pull request when a pinned version has an update.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Database images stay on their current major release line on purpose:
    # a major upgrade (e.g. PostgreSQL 16 -> 18) needs a data migration plan.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    # Database images stay on their current major release line on purpose:
    # a major upgrade (e.g. PostgreSQL 16 -> 18) needs a data migration plan.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: monthly
