# Continuous integration: every push to main and every pull request runs four
# independent jobs. Each proves one thing:
#   test        the code is linted, formatted and passes the test suite
#   migrations  the Alembic migrations build the schema the models expect, on real PostgreSQL
#   container   the image builds and the whole Compose stack serves requests
#   terraform   the infrastructure code is formatted and valid
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; it publishes nothing.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .
      # The tests use in-memory SQLite and set their own dummy settings (tests/conftest.py).
      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real PostgreSQL next to the job, the same version as compose.yaml.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: network_asset_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: network_asset_db
      POSTGRES_HOST: localhost
      SECRET_KEY: ci-only-secret-key-not-used-for-anything-real
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Upgrade to the latest revision
        run: alembic upgrade head
      # alembic check fails if the models describe anything the migrations do not create,
      # which catches a model change committed without its migration.
      - name: Models and migrations agree
        run: alembic check
      - name: Downgrade to empty, then upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head

  container:
    name: Image and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker build --check runs the Dockerfile linter built into BuildKit.
      - name: Lint the Dockerfile
        run: docker build --check .
      - name: Create a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Start the stack (db, migrate, app)
        run: docker compose up -d --build
      - name: Wait until the API and the database are ready
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ready && exit 0
            sleep 2
          done
          echo "API did not become ready" && exit 1
      - name: Exercise the API end to end
        run: |
          set -euo pipefail
          api=http://localhost:8000
          curl -fsS -X POST "$api/auth/register" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}'
          token=$(curl -fsS -X POST "$api/auth/login" \
            -d 'username=ci@example.com&password=ci-password-123' | jq -r .access_token)
          auth="Authorization: Bearer $token"
          curl -fsS "$api/auth/me" -H "$auth" | jq -e '.email == "ci@example.com"'
          asset=$(curl -fsS -X POST "$api/assets/" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"core-sw-1","asset_type":"switch","tenant":"CI","ip_address":"10.0.0.2"}' | jq .id)
          curl -fsS -X POST "$api/incidents/" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"title\":\"Port flapping\",\"asset_id\":$asset}" | jq -e '.status == "open"'
          # The image's HEALTHCHECK should have marked the app container healthy by now.
          for _ in $(seq 1 15); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && exit 0
            sleep 2
          done
          echo "app container is not healthy" && exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
      - run: terraform fmt -check -recursive
      # -backend=false: download the providers without touching any state or AWS account.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
